<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grievance Submission Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: #3498db;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .dashboard-btn {
            background: #2ecc71;
        }

        .dashboard-btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Submit Your Complaint</h1>

    <textarea id="complaint"
        placeholder="Describe your issue here...&#10;Example: No water supply for 3 days"></textarea>

    <button onclick="submitComplaint()">Submit Complaint</button>

    <div class="result" id="result"></div>

    <button class="dashboard-btn" onclick="goToDashboard()">
        View Dashboard
    </button>
</div>

<script>
function submitComplaint() {
    const complaintText = document.getElementById("complaint").value.trim();

    if (!complaintText) {
        alert("Please enter a complaint before submitting.");
        return;
    }

    fetch("/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ complaint: complaintText })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            "✅ Complaint categorized as: " + data.category.toUpperCase();

        document.getElementById("complaint").value = "";
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong. Try again.");
    });
}

function goToDashboard() {
    window.location.href = "/dashboard";
}
</script>

</body>
</html>
