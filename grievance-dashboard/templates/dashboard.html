<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grievance Dashboard</title>

<style>
    body {
        font-family: "Segoe UI", sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px;
    }

    h2 {
        text-align: center;
        color: #1a237e;
        margin-bottom: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        border-radius: 10px;
        overflow: hidden;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        font-size: 14px;
    }

    th {
        background: #1976d2;
        color: white;
        text-transform: uppercase;
        font-size: 13px;
    }

    tr:nth-child(even) {
        background: #f2f2f2;
    }

    tr:hover {
        background: #e3f2fd;
    }

    .status {
        font-weight: bold;
        padding: 6px 10px;
        border-radius: 12px;
        display: inline-block;
        font-size: 12px;
    }

    .SUBMITTED {
        background: #c8e6c9;
        color: #256029;
    }

    .NEEDS_MORE_INFO {
        background: #fff3cd;
        color: #856404;
    }

    .DRAFT {
        background: #e0e0e0;
        color: #424242;
    }

    .complaint {
        max-width: 350px;
        white-space: pre-wrap;
    }
</style>
</head>

<body>

<h2>📋 Grievance Dashboard</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Category</th>
            <th>Status</th>
            <th>Complaint</th>
        </tr>
    </thead>
    <tbody>
        {% for c in complaints %}
        <tr>
            <td>{{ c.name or "—" }}</td>
            <td>{{ c.phone or "—" }}</td>
            <td>{{ c.email or "—" }}</td>
            <td>{{ c.category or "General" }}</td>
            <td>
                <span class="status {{ c.status }}">
                    {{ c.status }}
                </span>
            </td>
            <td class="complaint">
                {{ c.raw_input or "—" }}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
